# Hugo writes a markdown copy of each page as index.md (see outputs in config.yaml).
# Requests with "Accept: text/markdown" to a directory URL get that copy, other requests get HTML.
# ponytail: q-values are ignored, any mention of text/markdown wins. Browsers never send it, so this is enough.
types {
    text/markdown md;
}

map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

map "$wants_markdown$uri" $markdown_file {
    default $uri;
    "~^1(?<dir>.*/)$" "${dir}index.md";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/markdown;

    location / {
        add_header Vary Accept;
        try_files $markdown_file $uri $uri/ $uri.html =404;
    }

    # Homepage only: "/" goes here through the index directive. Link headers (RFC 8288) point agents to machine-readable data.
    location = /index.html {
        add_header Vary Accept;
        add_header Link "</index.json>; rel=\"describedby\"; type=\"application/json\", </index.md>; rel=\"alternate\"; type=\"text/markdown\", </index.xml>; rel=\"alternate\"; type=\"application/rss+xml\"";
    }

    error_page 404 /404.html;
}
