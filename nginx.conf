server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Homepage only: "/" goes here through the index directive. Link headers (RFC 8288) point agents to machine-readable data.
    location = /index.html {
        add_header Link "</index.json>; rel=\"describedby\"; type=\"application/json\", </index.xml>; rel=\"alternate\"; type=\"application/rss+xml\"";
    }

    error_page 404 /404.html;
}
