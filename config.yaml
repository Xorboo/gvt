baseURL: "https://gvt.xorb.ooo/"

module:
  hugoVersion:
    min: "0.146.0"
locale: "en-us"
title: "GVT"
theme: "PaperMod"
buildFuture: true
enableRobotsTXT: true

# all talks on one page: covers use loading="lazy", so the browser loads them while you scroll
pagination:
  pagerSize: 1000

# search page needs the JSON index; markdown copies are served to agents that send Accept: text/markdown (see nginx.conf)
outputs:
  home: ["HTML", "RSS", "JSON", "markdown"]
  page: ["HTML", "markdown"]
outputFormats:
  markdown:
    mediaType: "text/markdown"
    baseName: "index"
    isPlainText: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema
  images: ["/gvt-card.png"]
  fuseOpts:
    keys:
      - { name: title, weight: 3 }
      - { name: speaker, weight: 3 }
      - { name: event, weight: 2 }
      - { name: description, weight: 2 }
      - { name: speakerinfo, weight: 1 }
      - { name: summary, weight: 1 }
      - { name: content, weight: 1 }
      - { name: permalink, weight: 1 }
    threshold: 0.1
    ignoreLocation: true
  title: "Games and Visuals Trójmiasto"
  description: "GVT Meetups"
  defaultTheme: auto # dark, light, auto
  homeInfoParams:
    Title: "Games & *V*isuals Trójmiasto" # *V* renders red, as on the talk covers
    Content: "Monthly gamedev meetups in Trójmiasto, join us!"
  socialIcons:
    - name: discord
      url: "/discord"
    - name: youtube
      title: "Old playlist"
      url: "https://www.youtube.com/playlist?list=PL97f0is2Y4VnWVgBYOlmYNJIRINzCwPvz"
    - name: youtube
      title: "New channel"
      url: "https://www.youtube.com/@gv3-yt"
    - name: linkedin
      url: "https://www.linkedin.com/company/games-visuals-tricity"
    - name: facebook
      url: "https://www.facebook.com/games.visuals"

  cover:
    hiddenInSingle: true
  footer:
    text: "Powered by [ururus](https://xorb.ooo)"

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
