<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Sometype Mono', monospace" fill="#fff">
  <!--
    Poster template, 1920x1080 design size. js/poster.js fills it in and renders it to PNG.
    - data-show="meetup|speaker": the element shows only on that poster type.
    - data-field="date|time|address|author|name|role": the text is set from the form.
    - data-field="photo" on an image: the href is set to the uploaded file.
    - data-anchor="right": in formats wider than 1920, the element moves right by the extra width.
    - data-row="GAP" data-x="X" [data-align="middle|end"]: the children go left to right, GAP apart, starting (or centered, or ending) at X.
    - data-fit="W": the font gets smaller if the text is wider than W.
    - data-until="SELECTOR" data-gap="G": the rect width extends to G before the left edge of the element that SELECTOR finds.
    Lines are 2 px rects; text separators are 1 px. Image hrefs are relative to this file.
  -->
  <rect width="100%" height="100%" fill="#030304" />

  <rect x="52" y="66" height="2" data-until=".logos" data-gap="10" />
  <g data-anchor="right">
    <g class="logos" transform="translate(340 48)">
      <image href="../images/pjatk-logo.svg" width="272" height="76" />
      <image href="../images/hackerspace-logo.png" x="321" y="-4" width="142" height="82" />
    </g>
    <image data-field="photo" x="920" y="66" width="948" height="948" preserveAspectRatio="xMidYMid slice" />
  </g>

  <g data-show="meetup">
    <!-- Centered between the top line (y 67) and the bottom line (y 1043). -->
    <text transform="rotate(-90)" x="-555" y="97" font-size="60" text-anchor="middle">Games &amp; <tspan fill="#e41921">V</tspan>isuals Trójmiasto</text>
    <g data-row="46" data-x="160">
      <text y="964" font-size="78" data-field="date">16.10</text>
      <rect y="901" width="1" height="69" />
      <text y="964" font-size="78" data-field="time">18:00</text>
    </g>
    <text x="160" y="1014" font-size="31.5" data-field="address" data-fit="720">PJATK, Targ Drzewny 9/11, Gdańsk</text>
    <rect x="52" y="1042" height="2" data-until="[data-field=author]" data-gap="28" />
    <g data-anchor="right">
      <text x="1868" y="1053" font-size="27.5" text-anchor="end" data-field="author">Jane Doe</text>
    </g>
  </g>

  <g data-show="speaker">
    <!-- Centered between the top line (y 67) and the bottom line (y 1013). -->
    <text transform="rotate(-90)" x="-540" y="97" font-size="60" text-anchor="middle">Games &amp; <tspan fill="#e41921">V</tspan>isuals Trójmiasto</text>
    <text x="160" y="903" font-size="60" data-field="name" data-fit="720">Jane Doe</text>
    <g data-row="68" data-x="160">
      <text y="968" font-size="33" data-field="role">prelegent</text>
      <rect y="944" width="1" height="28" />
      <text y="968" font-size="33" data-field="date">16.10</text>
      <rect y="944" width="1" height="28" />
      <text y="968" font-size="33" data-field="time">18:00</text>
    </g>
    <rect x="52" y="1012" width="808" height="2" />
  </g>
</svg>
